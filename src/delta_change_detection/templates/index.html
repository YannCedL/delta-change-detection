<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTA — Change Detection & Diff Inspector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 90%, rgba(245, 158, 11, 0.12) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .diff-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🔍</div>
            <div>
                <div class="logo-title">DELTA</div>
                <div class="logo-subtitle">Détection de Changements & Comparateur Temporel (Diffs)</div>
            </div>
        </div>
        <div class="badge">CHANGE DETECTION ENGINE ONLINE</div>
    </header>

    <div class="card">
        <div class="card-title">Modifications Temporelles Détectées (<span id="dDates" style="color:#fbbf24;">-</span>)</div>
        <div id="diffsList">Chargement des modifications...</div>
    </div>

    <script>
        async function chargerDetectionDelta() {
            try {
                const response = await fetch('/api/v1/detect?lat=48.8566&lon=2.3522');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('dDates').textContent = `${r.date_start} -> ${r.date_end}`;

                const list = document.getElementById('diffsList');
                list.innerHTML = '';

                (r.diff_items || []).forEach(d => {
                    list.innerHTML += `
                        <div class="diff-item">
                            <div>
                                <strong style="font-size:0.95rem; display:block; margin-bottom:0.2rem;">${d.field}</strong>
                                <span style="font-size:0.8rem; color:var(--text-muted);">
                                    Ancien: <span style="color:#ef4444;">${d.old_value}</span> | 
                                    Nouveau: <span style="color:#34d399;">${d.new_value}</span>
                                </span>
                            </div>
                            <span class="badge">${d.type}</span>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Erreur lors de la détection de changement Delta.");
            }
        }

        window.onload = chargerDetectionDelta;
    </script>
</body>
</html>
